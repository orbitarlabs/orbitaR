# Forty-one points with r2scan: ρ↑, ρ↓, σ↑↑, σ↑↓, σ↓↓, then τ↑, τ↓.
# The first ten keep τ_s ≥ σ_ss / 8ρ_s: α is 1 at the first, about 1e-3 at the second, 0 to rounding at the ninth,
# and above 2.5 at the third, eighth, and tenth; the fourth has low density; the fifth is near full spin
# polarization with α↓ ≈ 340. The eleventh and twelfth leave one spin empty (ζ = ±1).
# The rest test Libxc's input convention: σ_ss > 8ρ_sτ_s for one spin (13th) and both (14th, with σ↑↓ past its bound
# too); σ↑↓ past +s_ave (15th) and −s_ave (16th) once σ↑↑ meets its bound (σ↑↓² ≤ σ↑↑σ↓↓ keeps it inside before);
# a spin between the correlation and exchange density thresholds (17th) and one below both (18th, τ↓ below τ's
# threshold); a total density between the thresholds (19th) and below both (20th); both spins below the exchange
# threshold with the total above it (21st); τ↑ = 0 with ρ↑ > 0 (22nd); 1 − ζ below DBL_EPSILON (23rd: ρ↓ at the
# correlation threshold, 2ρ↓/ρ = 2e-17); σ = 0 just above the exchange threshold (24th), where σ's floor
# (1e-11)^{8/3} Bohr⁻⁸ is s² ≈ 4e-3; a total density at the correlation threshold (25th, kept: Libxc skips below
# it), and the same for the unpolarized row of the 26th. Libxc rebuilds each spin's share of ρ from ζ: a minority spin
# with τ_s/ρ_s^{5/3} large (27th, 28th reversed), a minority share that rounds to 0 (29th, 30th), an exchange-kept
# minority past ζ's threshold (31st, 32nd), and one just inside (33rd, 2ρ↓/ρ = 4e-16) and outside it (34th, 1.3e-16).
# A minority whose share sets ∂ζ/∂ρ↑ = 2ρ↓/ρ² at ordinary density (35th, 36th reversed, and 37th).
# τ at and below its floor with σ↑↑ one ulp below its cap 8ρ↑τ↑ at dilute spins (38th), σ↑↓ at −s_ave with a near-empty spin (39th),
# and points whose unpolarized rows sit at (n, σ, τ) = (1e-11, 8e-11, 1) (40th) and 2e-6 above the correlation
# threshold (41st), not one ulp as in the review: science S1 reads a long number that close as an engine constant.
