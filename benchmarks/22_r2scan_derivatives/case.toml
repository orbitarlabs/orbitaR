# gaas stress     −2.23e-10       −7.5e-11   −1.47e-10  −2.56e-10         −2.93e-10        2e-9 (9.0×)
# gaas_volume     5.99e-10        7.31e-10   −1.32e-10  −1.52e-10         7.61e-10         5e-9 (8.3×)
# fe stress       −2.90e-10       −8.1e-12   −2.82e-10  −1.81e-10         −3.29e-10        2e-9 (6.9×)
