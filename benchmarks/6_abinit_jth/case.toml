[case]
tier = "pr"
status = "active"
claims = ["correctness"]
reference = "same-dataset"

[tolerance]
free_energy_error_ha_max = 5e-10
term_error_ha_max = 1e-9
eigenvalue_error_ha_max = 1e-10
fermi_level_error_ha_max = 5e-11
magnetization_error_bohr_magneton_max = 1e-9

[why]
inputs = """\
nonmagnetic Fe stays out: ABINIT's tol8 cut, which the engine does not take, moves its F past \
free_energy_error_ha_max"""
tolerance = """\
occupations stay out: they follow from eigenvalues, E_F, and the smearing, and ABINIT's full ones (1.99999999997) lie \
within 1e-6 of every literal 2 in the engine, which science S1 flags"""
free_energy_error_ha_max = "F is stationary at the fixed point, so its error is mostly the two codes' numerics"
term_error_ha_max = """\
the terms are not stationary: they carry the stop's first-order error, so they take a looser bound than F"""
eigenvalue_error_ha_max = "no derived bound; a margin over the records"
fermi_level_error_ha_max = "no derived bound; a margin over the records"
magnetization_error_bohr_magneton_max = """\
no derived bound; a margin over the records; the antiferromagnet's moment is 1.7e-5 μB, not 0: a convention of \
ABINIT's mixed spin derivatives, which the engine takes too"""
