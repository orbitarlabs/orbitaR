[case]
tier = "pr"
status = "active"
claims = ["correctness"]
reference = "oracle"

[tolerance]
term_difference_ha_max = 5e-10
fermi_level_difference_ha_max = 2e-11
magnetization_difference_bohr_magneton_max = 1e-10
eigenvalue_difference_ha_max = 5e-11
weighted_eigenvalue_difference_ha_max = 2e-10

[why]
inputs = """\
Si runs at 5.5 Ha, whose grids (16³, 24³) keep the operations with t = ¼. The antiferromagnet converges slowly, so it \
runs at energy_tolerance_ha 1e-10: at 1e-9, a rotated rerun moved an output past the harness's 1e-10 bound"""
tolerance = "terms, magnetization, and eigenvalues: no derived bound; a margin over the records"
fermi_level_difference_ha_max = """\
each SCF stops at ‖Δñ‖ < 1e-11, where each E_F lies within 0.54 × 1e-11 Ha of its fixed point (tests/ks/scf.rs \
at_the_stop_eigenvalues_and_e_f_lie_within_0_54_terms_within_1_density_limit_of_a_tight_stop); a pair's E_F lie \
within twice that"""
weighted_eigenvalue_difference_ha_max = "a sum over the reported bands, whose errors partly cancel"
