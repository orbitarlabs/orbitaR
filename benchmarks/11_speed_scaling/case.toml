[case]
tier = "claim"
status = "planned"
claims = ["speed", "correctness"]
reference = "same-dataset"
rivals = ["qe", "abinit"]

[tolerance]
free_energy_error_ha_per_atom_max = 2.5e-10

[why]
inputs = "each cell of reference/cells.py has fewer k-points than cores"
free_energy_error_ha_per_atom_max = """\
F per atom against ABINIT on the same JTH files at each input's own cutoff (reference/<name>.json), from one untimed \
orbitaR run per input at that cutoff. Case 6 allows 5e-10 Ha for its cells of one and two atoms; both codes sum their \
numerical errors over atoms, so the bound holds per atom: the two-atom share, 2.5e-10 Ha"""
