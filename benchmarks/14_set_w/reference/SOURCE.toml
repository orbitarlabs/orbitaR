convention = """\
Case 6's reference/run.sh runs each <name>.abi on the full k mesh, in restart chunks of at most 2 h: chunk k > 1 \
reads chunk k-1's WFK (getwfk_filepath). Stop rule: stop at the first chunk end with at least 40 \
steps where the final step, whose F is reported, has vres2 < 1e-16 and the last 10 steps' ETOT values, a restart \
inside them included, span < 1e-11 Ha/atom; cap 200 steps, where a miss is reported. ETOT prints 11 decimals, so a \
span of 0 means below print precision (1e-11 Ha / natom). Band check: the top band's final occupation, as a fraction \
of a full state, must be < 1e-14 (orbitaR's EMPTY bound); it is read from ABINIT's output, or, marked derived, from \
the JSON's eigenvalues and Fermi level with ABINIT's Fermi-Dirac smearing (occopt 3, tsmear 0.00225 Ha). Case 6's \
reference.py reduces the last chunk run to <name>.json (GSR terms in Ha; etotal is the free energy F). No reference \
covers tuning/. Per cell (steps, chunks; final-step vres2; span in Ha/atom; nband; top-band \
occupation): al2o3_40 200, 2 (rule first met at chunk 1; the second ran by plan); 2.545e-21; 0; 256; 3.5e-185 \
derived. sto39_vo 50, 1; 5.006e-19; 0; 313; 3.0e-141 derived. al2o3_slab 200, 2; 1.862e-19; 4.0e-12; 192; \
3.7e-144 derived. gaas32_as 200, 5 (rule first met at chunk 1; the rest ran by plan); 2.306e-19; 0; 353; 4.9e-94 \
derived. fe2o3_30 (with cells.py MIXING) 200, 2 (rule first met at chunk 2); 3.80e-18; 0; 270; 0.0e+00 from \
ABINIT's output. si63_vac (default mixing) 40, 2; 1.2e-20; 0; 378; 0.0e+00 from ABINIT's output. si128 (nband 320 \
and diemac 12.0, cells.py BANDS and MIXING) 70, 7; 1.9e-23; 0; 320; 7.7e-19 derived. Its chunks ran nstep 10 \
each, every chunk after the first starting from the previous chunk's density: one si128.abi, run as the restart \
rule above with the density carried in place of WFK. Each replacements/<name>.abi has its own <name>.json, made \
by runner-jobs run 70 on the claim node (8 ranks) by the same rule in chunks of 40 steps, with run.sh and \
reference.py as above and the Gamma-only cells at paral_kgb 1 and autoparal 1: si31_vac 40, 1; 3.423e-21; 0; \
186; 3.4e-92 derived. si96 40, 1; 7.228e-23; 1.0e-13; 576; 6.7e-93 derived. al2o3_30 40, 1; 1.879e-21; 0; \
192; 3.4e-185 derived. reference.py ran in h5py 3.12.1 and numpy 2.1.3"""
