convention = "each row with the operations that the engine keeps at its settings (Operation::keeps_grid: those that map the k mesh and both FFT grids) and nothing else; gaas.abi through benchmarks/6_abinit_jth/reference/run.sh (kptopt 3, nsym 1, tolvrs 1e-24, tolwfr 1e-22, nline 8, nstep 300): both codes find only the identity; fe.abi and al.abi the same lines without nsym 1, so ABINIT finds the 48 operations of Im-3m and Fm-3m, none with a translation, and runs symrhoij and symdij on the full k mesh; input.abi and si8.abi the same lines without nsym 1 and with the engine's 24 operations given (nsym 24, symrel, tnons 0): ABINIT's finder keeps diamond's 48 (Si8: 192) also where their translations of 1/4 and 1/2 miss its fine grid (ngfftdg 30, 45), and with them its direct and double-counting totals part by 6.6e-7 (Si2) and 1.8e-6 Ha (Si8), while all 48 at ngfftdg 32, which 1/4 maps onto itself, agree to 7e-14 (runs r2-input-upright-sym-b4, r2-si8-sym-b4, r2-input-upright-sym-fine32-b4 of RUN.txt steps 6 and 7, not used); the 24-operation runs agree to 2e-13 and 9e-13; hcp.abi (RUN.txt step 10): the PAW review's lowered hcp Fe cell (rows [[4.75, 0, 0], [-2.38, 4.12, 0.012], [0.032, -0.021, 7.6]] Bohr, sites 0 and (2/3, 1/3, 1/2)) at Gamma, 15 Ha, with the engine's grids given (ngfft 18 18 30, ngfftdg 24 24 40, which the inversion's translation fits), symmetry on in both codes (the identity and the inversion that swaps the sites), from spinat 3.5: state A, converged at step 100; a lower state B is converged only at 8 Ha: ABINIT's run there from 3.5 (RUN.txt step 9b, converged at step 237) lies 3.7e-3 Ha below the engine's state, and the engine holds it (that run's bands imported and continued in the engine: residuals 3e-10, F +1.2e-10 per cell with Σ N_s δ_s), but no engine start tried reaches it; ABINIT's runs at 12 Ha from 2.5 and 3.5 and at 15 Ha from 2.5 stopped at nstep 300 short of tolvrs, their last iterates about 4.7e-3 Ha below A (15 Ha: residm 4.9e-10, direct minus double counting 3.6e-7 Ha), so B at 12 and 15 Ha is not converged; input.abi, al.abi, gaas.abi, hcp.abi, and fe.abi in the engine's upright frame (Cell::frame), si8.abi's cube its own; each .abi computes 4 bands above the compared ones (nbdbuf 4) so that tolwfr holds on these; case 6's reference.py, then reduce.py (its docstring): the terms in Ha, F in the direct form, the compared bands, core_offset_ha from exccore.json (the pinned build with exccore.patch, nstep 1, the pseudo and the all-electron core τ). gaas.json and hcp.json also hold forces_ha_bohr and force_mean_ha_bohr: reduce.py --abo on the run.abo of the same runs (build A; gaas.abi's run r2-gaas-b4, nsym 1, 26 steps; hcp.abi's r2-hcp-15-sym-spin3.5-b4, nsym 2, state A), its last cartesian forces in Ha/Bohr after ABINIT removed their mean, and that mean as its line prints it. paw-si.json and paw-fe.json: dump.py (its docstring) on the PAW_DUMP files of ABINIT build P (the pinned build with exccore.patch and abinit-paw-dump.patch, sha256 2e9d9ac8f71098000b6644608979ba7037acf4c140e80e0c63680411f09b620f; the dump is off unless PAW_DUMP=1 and printed the same etotal as build A) run by run.sh at nstep 300 with PAW_DUMP=1 on paw-si.abi and paw-fe.abi, the two decks as they ran (run.sh adds its common lines, nsym 1 among them, so the run.abi files had sha256 b5081ecf87ecf6658596ab16d5fa38f8f9187b2744913772a94e8c84ef417ed8 and e3c1987bec1ffea1b7555d4e918ca2fc5ff78b2ce17f3891a8335104cda898da with the run's pp_dirpath): the Si and Fe rows' settings in ABINIT's own conventional frame (Si by xcart in Å, Fe by rprim ±0.5 at 2.83 Å), fband 4.0 without nbdbuf 4, and nsym 1 in place of the rows' operations: atom 1 of each at the last SCF step, one pawdenpot call (ρ_ij, e1xc, etild1xc) and the pawdij call after it (the same ρ_ij, dijxc)"
