[case]
tier = "push"
status = "active"
claims = ["correctness"]
reference = "oracle"

# Each SCF stops at ‖Δñ‖ 1e-11, where each eigenvalue lies within 0.54 × 1e-11 Ha of its fixed point (fitted,
# ks/scf.rs), so the two runs' eigenvalues lie within twice that. F is stationary at the fixed point, so the stop moves
# it at second order only (tests/ks/crystal.rs, the_free_energy_is_stationary_at_the_self_consistent_state). F's
# tolerance sits at the float floor of the two solvers; the stop does not set it.
[tolerance]
eigenvalue_difference_ha_max = 2e-11
free_energy_difference_ha_max = 1e-12
