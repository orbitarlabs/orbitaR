[case]
tier = "node"
status = "active"
claims = ["correctness"]
reference = "literature"

[tolerance]
fe_delta_mev_max = 1.4
co_delta_mev_max = 1.9
ni_delta_mev_max = 3.1
cr_delta_mev_max = 3.3
mn_delta_mev_max = 1.9
convergence_mev_max = 0.5

[why]
reference = """\
the all-electron WIEN2k rows of the Delta test, by the Delta gauge: a wrong magnetic ground state moves E(V), which \
cases 6, 7 and the ACWF set (no spin) cannot see"""
inputs = """\
Fe, Co, Ni ferromagnetic; Cr, Mn antiferromagnetic in the 2-atom primCIF cells, moments ±, the spin order that the \
Delta README asks for. E(AFM) − E(NM) at V_CIF: Cr −14.6, Mn −78.5 meV/atom; the total moment of both stays below \
1e-5 μB. O is out: a molecular crystal, not a magnetic metal. The rule of convergence_mev_max gives E, mesh, w: Fe 30 \
Ha, 20³, 0.001 Ha; Co 30 Ha, 24·24·15, 0.002 Ha; Ni 40 Ha, 20³, 0.002 Ha; Cr 30 Ha, 16³, 0.001 Ha; Mn 30 Ha, \
28·28·20, 0.002 Ha"""
tolerance = """\
<el>_delta: eos::delta, meV/atom, of a 7-volume eos::fit at V/V_CIF = acwf::SCALES against the element's WIEN2k row. \
Each bound is the sum of three budgets, to 0.1: dataset, JTH v0.2 against WIEN2k, the worse of 80 Ha and 20 Ha \
(abinit-history.txt of history.tar.gz), by eos::delta, not v2.0; numerics 0.58, the convergence rule and the \
remainder it cannot see, 2 × 0.29, the Δ of a ±0.5 meV shape error refitted over the 7 volumes; reference, WIEN2k.txt \
print rounding (V0 4, B0 3, B1 2 decimals)"""
fe_delta_mev_max = "dataset 0.818 + numerics 0.58 + reference 0.003 = 1.401"
co_delta_mev_max = "dataset 1.235 + numerics 0.58 + reference 0.003 = 1.818"
ni_delta_mev_max = "dataset 2.457 + numerics 0.58 + reference 0.003 = 3.040"
cr_delta_mev_max = "dataset 2.697 + numerics 0.58 + reference 0.003 = 3.280"
mn_delta_mev_max = "dataset 1.254 + numerics 0.58 + reference 0.002 = 1.836"
convergence_mev_max = """\
the bound on the change that a neighbour makes to the shape E(0.94 V) − E(V), E(1.06 V) − E(V), by one rule on every \
element: 1. E, at the first run's (n, w): the first of 10, 20, … Ha where E + 10 and E + 20 Ha each change the shape \
by less than the bound; 2. (n, w), at E: in the order w = 0.002 Ha then halved, n = 8, 12, … 40 within each w, the \
first (w, n) at or after the first run's (n, w) where (n, w/2), (n + 4, w) and (n + 8, w) each change it by less; n \
is the a-axis mesh (Co, Mn: the c-axis mesh n · a / c, rounded), and n + 4 adds 4 on every axis; 3. the measure \
judges all five neighbours at (E, n, w). One start for every element: a start from an earlier sweep per element would \
tune the rule to its result. A rule on the span E(1.06 V) − E(0.94 V) alone passed Fe at n = 16: a span misses an \
error in the curvature. Worst neighbours (meV/atom): Fe 0.353, Co 0.409, Ni 0.498, Cr 0.205, Mn 0.434. At 30 Ha and w \
0.002, Fe's half-width neighbour moves the shape 0.50–0.63 for every n = 20 … 40; at w 0.001, n 8 fails (its w 0.0005 \
run at V does not converge in 200 SCF steps), and 12 and 16 fail on k. The rung below E fails by its worst neighbour: \
Fe 20 Ha 0.950, Co 20 Ha 1.52, Ni 30 Ha 1.34, Cr 20 Ha 4.33, Mn 20 Ha 0.510. The first run took each dataset's cutoff \
hint (benchmarks/DATASETS.toml) as E: Δ Fe 0.803, Co 1.741, Ni 2.429, Mn 1.169, Cr 8.030 meV/atom; Cr failed its \
bound by the cutoff: ABINIT 10.0.3 gives orbitaR's F on all 15 Cr and Mn runs (≤ 4.7e-9 Ha)"""
