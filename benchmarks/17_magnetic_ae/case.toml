[case]
tier = "node"
status = "active"
claims = ["correctness"]
reference = "literature"

# Spin-polarized PBE equations of state, JTH v2.0, against the all-electron WIEN2k rows of the Delta test
# (reference/SOURCE.toml), by the Delta gauge: a wrong magnetic ground state moves E(V), which cases 6, 7 and the
# ACWF set (no spin) cannot see.
#
# metric       what
# <el>_delta   eos::delta, meV/atom, of a 7-volume eos::fit at V/V_CIF = acwf::SCALES against the element's WIEN2k row
# convergence  the cutoff E, k-mesh n and Fermi–Dirac width w of each element, by one rule on the shape
#              E(0.94 V) − E(V), E(1.06 V) − E(V) and a bound of 0.5 meV/atom on the change a neighbour makes to it:
#              1. E, at the first run's (n, w): the first of 10, 20, … Ha where E + 10 and E + 20 Ha each change
#                 the shape by less than the bound
#              2. (n, w), at E: in the order w = 0.002 Ha then halved, n = 8, 12, … 40 within each w, the first (w, n)
#                 at or after the first run's (n, w) where (n, w/2), (n + 4, w) and (n + 8, w) each change it by
#                 less; n is the a-axis mesh (Co, Mn: the c-axis mesh n · a / c, rounded); n + 4 adds 4 on every axis
#              3. the measure judges all five neighbours at (E, n, w)
#              The same start for every element (the Delta protocol's own Fermi–Dirac width is 0.00225 Ha; a start
#              taken from an earlier sweep per element would tune the rule to its result).
# A rule on the span E(1.06 V) − E(0.94 V) alone passed Fe at n = 16: a span misses an error in the curvature.
# rule result  E, mesh, w, worst neighbour (meV/atom): Fe 30 Ha, 20³, 0.001 Ha, 0.353;
#              Co 30 Ha, 24·24·15, 0.002 Ha, 0.409; Ni 40 Ha, 20³, 0.002 Ha, 0.498; Cr 30 Ha, 16³, 0.001 Ha, 0.205;
#              Mn 30 Ha, 28·28·20, 0.002 Ha, 0.434.
#              At 30 Ha and w 0.002 Fe's half-width neighbour moves the shape 0.50–0.63 for every n = 20 … 40; at
#              w 0.001, n 8 fails (its w 0.0005 run at V does not converge in 200 SCF steps), 12 and 16 fail on k.
#              The rung below E fails by its worst neighbour: Fe 20 Ha 0.950, Co 20 Ha 1.52, Ni 30 Ha 1.34,
#              Cr 20 Ha 4.33, Mn 20 Ha 0.510.
# first run    89447ff, clean, engine 22fe255e…, 28 965 s on 4 CPUs, with steps 2–3 only and each dataset's
#              DATASETS cutoff hint as E: Δ Fe 0.803, Co 1.741, Ni 2.429, Mn 1.169, Cr 8.030 meV/atom (fit V0
#              11.984 Å³, B0 164.6 GPa against WIEN2k 11.773, 183.9); convergence 0.497. Cr failed its bound.
#              Cause, the cutoff: ABINIT 10.0.3 gives orbitaR's F on all 15 Cr and Mn runs (≤ 4.7e-9 Ha). Step 1 was
#              written after this run; the bounds stand, and its record stays.
# spin order   E(AFM) − E(NM) at V_CIF, the first run's E, mesh and width, moments [0, 0] for NM: Cr −14.6,
#              Mn −78.5 meV/atom. The total moment of both stays below 1e-5 μB; the engine reports no moment per atom.
#
# elements     Fe, Co, Ni ferromagnetic; Cr, Mn antiferromagnetic in the 2-atom primCIF cells, moments ±; the Delta
#              README asks for that spin order. O is out: a molecular crystal, not a magnetic metal.
#
# budget, meV/atom  Fe     Co     Ni     Cr     Mn
# dataset           0.818  1.235  2.457  2.697  1.254  JTH v0.2 against WIEN2k, the worse of 80 Ha and 20 Ha
#                                                      (abinit-history.txt of history.tar.gz), by eos::delta; not v2.0
# numerics          0.58   0.58   0.58   0.58   0.58   the rule here and the remainder it cannot see: 2 × 0.29, the Δ of
#                                                      a ±0.5 meV shape error refitted over the 7 volumes
# reference         0.003  0.003  0.003  0.003  0.002  WIEN2k.txt print rounding: V0 4, B0 3, B1 2 decimals
# sum → bound       1.4    1.9    3.1    3.3    1.9    each sum rounded up to 0.1
#
# Not judged (no output read): the moments of the earlier design, WIEN2k PBE Fe 2.21 μB at a = 2.860 Å
# (Fu, Singh, PRB 100, 045126, Table I) and Fe 2.22, Ni 0.64 μB (Tran, Ehsan, Blaha, PRMaterials 2, 023802,
# Table IV); orbitaR gave 2.2496 and 0.6345 μB at k20/0.004 Ha and k32/0.002 Ha.
[tolerance]
fe_delta_mev_max = 1.4
co_delta_mev_max = 1.9
ni_delta_mev_max = 3.1
cr_delta_mev_max = 3.3
mn_delta_mev_max = 1.9
convergence_mev_max = 0.5
