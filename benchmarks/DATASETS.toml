# The recipe of each file that the install job builds.
[qe.built.As]
pslibrary = "https://raw.githubusercontent.com/dalcorso/pslibrary/835dd6477c90fa9d59524914de50901d4be73e36"
jobs = { "paw_ps_high.job" = "b7bb6caf346bbcd3796f65ce75d9f963c1d46b9c6c9ab30e83585311b35d1219", "pbe/environment.job" = "45e09f00ea5114125cbc05b2a74ee65781f01e7dab125d32168c6a28ea7027d7", License = "204d8eff92f95aac4df6c8122bc1505f468f3a901e5a4cc08940e0ede1938994" }
