generator = "ld1.x of the QE install"
# ld1.x writes the day it runs into the UPF, on 2 lines. The pin is of a build on that day: ' 8Nov2026'. A rebuild sets
# its own date on those 2 lines back to this one before the sha256 check (runner-jobs run 57: '11Nov2026' to ' 8Nov2026',
# pin ok; ld1.x v.7.5).
pinned_date = " 8Nov2026"

# Our own datasets: datasets/<family>/<element>.in ─▶ the pinned ATOMPAW ─▶ <element>.xml beside
# it, which the family table datasets/<family>.toml pins. This table pins the builder alone.
# `cargo xtask atompaw` (xtask/src/atompaw.rs) installs ATOMPAW from conda-forge with micromamba into a directory
# outside the repository, checks that install against `packages` and `binaries`, builds each file twice, and checks
# the rebuild's numbers against the committed datasets/<family>/<element>.xml at its family table's pin. `--write`
# writes that file. The bytes are data, the rebuild is
# judged by numbers: the host's libm (glibc 2.39, FMA on and off) moves them by 2e-8 (atompaw.rs REBUILD_REL).
# ATOMPAW writes the day and time of its run on one line (xmlinterface.F90, PrintDate); a build sets that line to
# pinned_date, the stamp of the build that made the pins, before the sha256 check. Two builds of O.in differ on that
# line alone (lead's container, 2026-11-21: `cmp` finds line 11 only).
# ATOMPAW also writes its author's name and email address on two header lines; a build drops them (atompaw.rs CONTACT),
# because the repository holds no address, and refuses a file that still names one.
# Each run gets PATH and atompaw.rs NUMERICS alone: OPENBLAS_CORETYPE=HASWELL, OPENBLAS_NUM_THREADS=1. OpenBLAS picks
# its kernel by CPU, and the kernels write other bits (lead's container, 2026-11-21: SkylakeX, Haswell = Zen, and
# SandyBridge = Nehalem give three O files); Haswell runs on any x86-64 CPU with AVX2. ci.yml's check job rebuilds
# every input on a GitHub runner, a second CPU class, against the committed files.
# packages: the whole install that micromamba solved for atompaw=4.2.0.4=h8876d29_0 on 2026-11-21, each md5 matched to
# api.anaconda.org; BLAS, libxc, and the GCC runtime can change output bits, so the set is pinned.
[atompaw]
version = "4.2.0.4"
build = "h8876d29_0"
sha256 = "6b28f546e012636620d811f08a87a4bdda074a6a75e3819dfdbb1b3959ccf13f"
pinned_date = "11/21/2026, 02:23:53.367"
