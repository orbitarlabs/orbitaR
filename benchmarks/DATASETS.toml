# The files that rival runs read, each pinned by its sha256; xtask/src/harness/datasets.rs reads this file.
# A dataset family that orbitaR reads is a table of its own: datasets/<family>.toml.

# QE's own files for the rival runs (harness/rival/qe.rs): SSSP 1.3.0 PBE efficiency, Prandini et al., npj Comput.
# Mater. 4, 72 (2018), doi:10.24435/materialscloud:f3-ym. CC BY 4.0; each file keeps its source's license (pslibrary:
# GPL). The install job unpacks the archive into ORBITAR_RIVALS/<directory>; a run checks each file by its sha256.
# A rival must solve each cell with JTH's electron count.
# SSSP's As.pbe-n-rrkjus_psl.0.2 holds 5 valence electrons and JTH's As holds 15, so QE's As is not SSSP's.
# pslibrary 1.0.0 defines As.pbe-dn-kjpaw_psl.1.0.0 (3d in valence, 15 electrons) but publishes no UPF for it.
# The install job builds that file by [qe.built.As]:
#   pslibrary's paw_ps_high.job + pbe/environment.job's values ─▶ the As input ─▶ the node's QE ld1.x ─▶ <directory>
# The pinned file came from runner-jobs run 42486149733; run 42503693733 rebuilt it to the same sha256.
# The file is GPL-2.0 (pslibrary's License) and stays out of the repository.
# Fe, Sr, and Ti: the archive's files, each sha256 recomputed from the archive at its pin (PR #39); runner-jobs run 50
# (job 129010467389) found Fe on the node's disk at its pin.
[qe]
archive = "https://archive.materialscloud.org/records/rcyfm-68h65/files/SSSP_1.3.0_PBE_efficiency.tar.gz"
archive_sha256 = "7a85b71fa3d68df1b5ed33c55c7057681fbf10377ae3b3eac9392924d9189f12"
directory = "SSSP-1.3.0-PBE-efficiency"

[qe.files]
Al = { file = "Al.pbe-n-kjpaw_psl.1.0.0.UPF", sha256 = "fd7b78921e6d0939095b681c328732668eaefd1dee6882fdbc03be463550cc97" }
