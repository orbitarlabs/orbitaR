each bound lies ≥ 40× below every force term but two core terms: Fe's is 0 and FeO's 1.0e-7 (O's small ñ_c), only 2× \
its bound. GaAs tests the core term: 1.3e-4 Ha/Bohr along the move"""
gaas_force_difference_ha_bohr_max = """\
PBE one-center D^xc ≠ ∂E/∂ρ_ij (pawxcm: radial derivative of v, dv/dn by scaling); record 8.5e-8; bound 5.9× the \
record"""
