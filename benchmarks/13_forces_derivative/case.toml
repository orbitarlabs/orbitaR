gaas's D^xc gap, and with spin also ∂v↑/∂n↓ := ∂v↓/∂n↑; record 8.5e-7; bound 3.5× the record"""
fe_lda_force_difference_ha_bohr_max = """\
F rounding: 1e-12 Ha over 2e-4 Bohr = 5e-9; record 5.2e-9; bound 10× the rounding"""
feo_force_difference_ha_bohr_max = """\
F rounding (5e-9) plus FeO's PBE D^xc residual; record 9.8e-9; bound 5.1× the record"""
