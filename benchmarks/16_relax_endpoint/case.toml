[case]
tier = "pr"
status = "active"
claims = ["correctness"]
reference = "analytic"

# "An independent single-point run checks each relaxation endpoint" is this case's rule. orbitaR is its own
# reference, as in cases 13 and 15: an ASE relaxation over `orbitar ipi`, whose ks::Session starts each geometry warm,
# must end where a cold `orbitar run` of the endpoint geometry agrees.
# relaxations  [relax] below: ASE 3.29.0 BFGS over SocketIOCalculator to max|F| < 0.01 eV/Å, at the input's cell
#              ("ions") or with FrechetCellFilter ("cell"), which reads the stress through ipi's virial −Ω σ
#              (xtask/src/harness/relax.rs); the endpoint then runs cold as the input, and evidence.warm holds the
#              session's outcome line there
# warm         a cell move restarts the session cold (its warm key holds every setting but the positions), so the
#              "cell" rows compare two cold runs of one geometry: they check the geometry and stress that ipi passes
# out of scope the timed relaxation race against QE (the optimization claim) is a later claim-tier step, and so is a
#              measured opt-out of ipi's stress (it costs 1.04 to 1.07 per SCF)
#
# input     cell                                                       BFGS steps  record (moment)
# si-ions   Si pair, fixed fcc cell, rattled; 8 Ha, 2³ k                6
# si-cell   the same atoms in a sheared, stretched cell                 13
# fe-ions   ferromagnetic Fe pair, fixed cubic cell, rattled; 12 Ha     4           4.155 μB (start 2 × 2.5)
# fe-cell   ferromagnetic one-atom bcc Fe, strained cell; 12 Ha, 4³ k   17          1.885 μB (start 2.5)
# The Fe pair at a free cell slides from bcc toward fcc at 2³ k (−1.26 eV over 41 steps, 190 s), so the cell row takes
# the one-atom cell, whose forces vanish by symmetry. Its F rises 0.019 eV along the path: at 12 Ha the fixed-set
# stress is not dF/dV across set changes (case 15 "Pulay"); the endpoint check holds at any cutoff.
#
# bounds    each metric is a share of its bound, so 1 is the bound; τ = scf.energy_tolerance_ha = 1e-9
# F         the stop rule (src/ks/scf.rs DENSITY_SHARE): ‖Δñ‖ < τ/100 and each energy within 0.54 ‖Δñ‖ of its fixed
#           point, so two runs lie within 2 · 0.54 τ/100 = 1.08e-11 Ha (tests/ks/run.rs: 1.1e-11)
# force     F's error, as a function of one atom's position, is a trigonometric polynomial of degree G_max (the
#           density sphere, √(2 · basis.density_cutoff_ha)); Bernstein: its slope ≤ G_max · 1.08e-11 Ha/Bohr
#           (Si 6.1e-11, Fe 7.5e-11)
# stress    (1/Ω) ∂/∂ε of the same error: a strain moves a point r by ε r, |r| ≤ D, the cell's longest diagonal, so
#           ≤ G_max · D · 1.08e-11 / Ω (Si 3.8e-12 to 4.0e-12, Fe pair 4.5e-12, Fe atom 9.0e-12 Ha/Bohr³)
# fmax      ASE's stop on the cold forces: max over atoms |f| / 0.01 eV/Å
#
# metric    record: largest share of F, force, stress (the _difference readouts hold the gaps)
# si-ions   1.8e-3 (F 2.0e-14 Ha), 4.2e-3 (force 2.6e-13 Ha/Bohr), 1.0e-3 (stress 4.0e-15 Ha/Bohr³)
# si-cell   1.4e-3, 1.1e-5, 1.7e-6
# fe-ions   6.6e-2 (F 7.1e-13), 2.4e-3 (force 1.8e-13), 0.13 (stress 6.0e-13)
# fe-cell   0, 0, 0: two cold runs of one geometry, bitwise equal
[tolerance]
si_ions_free_energy_ha_share_max = 1.0
si_ions_force_ha_bohr_share_max = 1.0
si_ions_stress_ha_bohr3_share_max = 1.0
si_ions_fmax_share_max = 1.0
si_cell_free_energy_ha_share_max = 1.0
si_cell_force_ha_bohr_share_max = 1.0
si_cell_stress_ha_bohr3_share_max = 1.0
si_cell_fmax_share_max = 1.0
fe_ions_free_energy_ha_share_max = 1.0
fe_ions_force_ha_bohr_share_max = 1.0
fe_ions_stress_ha_bohr3_share_max = 1.0
fe_ions_fmax_share_max = 1.0
fe_cell_free_energy_ha_share_max = 1.0
fe_cell_force_ha_bohr_share_max = 1.0
fe_cell_stress_ha_bohr3_share_max = 1.0
fe_cell_fmax_share_max = 1.0

[relax]
si-ions = "ions"
si-cell = "cell"
fe-ions = "ions"
fe-cell = "cell"
