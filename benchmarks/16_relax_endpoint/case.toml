[case]
tier = "pr"
status = "active"
claims = ["correctness"]
reference = "analytic"

[tolerance]
si_ions_free_energy_ha_share_max = 1.0
si_ions_force_ha_bohr_share_max = 1.0
si_ions_stress_ha_bohr3_share_max = 1.0
si_ions_fmax_share_max = 1.0
si_cell_free_energy_ha_share_max = 1.0
si_cell_force_ha_bohr_share_max = 1.0
si_cell_stress_ha_bohr3_share_max = 1.0
si_cell_fmax_share_max = 1.0
fe_ions_free_energy_ha_share_max = 1.0
fe_ions_force_ha_bohr_share_max = 1.0
fe_ions_stress_ha_bohr3_share_max = 1.0
fe_ions_fmax_share_max = 1.0
fe_cell_free_energy_ha_share_max = 1.0
fe_cell_force_ha_bohr_share_max = 1.0
fe_cell_stress_ha_bohr3_share_max = 1.0
fe_cell_fmax_share_max = 1.0

[relax]
si-ions = "ions"
si-cell = "cell"
fe-ions = "ions"
fe-cell = "cell"

[why]
reference = """\
an independent single-point run checks each relaxation endpoint: an ASE relaxation over `orbitar ipi`, whose \
ks::Session starts each geometry warm, must end where a cold `orbitar run` of the endpoint geometry agrees"""
inputs = """\
a cell move restarts the session cold (its warm key holds every setting but the positions), so the cell rows compare \
two cold runs of one geometry: they check the geometry and stress that ipi passes"""
tolerance = """\
each metric is a share of its bound, so 1 is the bound; τ = energy_tolerance_ha = 1e-9. F: both runs stop at ‖Δñ‖ < \
τ/100. On four plane-wave LDA models (Si, Al, an 8-cell Al chain, and the chain with an on-site U) F lay within 0.54 \
‖Δñ‖ of its converged value, an empirical fit; F's bound takes it, 2 · 0.54 τ/100 = 1.08e-11 Ha. On the engine's \
synthetic crystals F, stationary, lies within 0.01 τ/100 of a tight stop (tests/ks/scf.rs \
at_the_stop_eigenvalues_and_e_f_lie_within_0_54_terms_within_1_density_limit_of_a_tight_stop); the fit is for F \
alone: a term there reaches 0.78. force: F's error, as a function of one atom's position, is a trigonometric \
polynomial of degree G_max (the density sphere, √(2 · basis.density_cutoff_ha)); by Bernstein its slope is ≤ G_max · \
1.08e-11 Ha/Bohr (Si 6.1e-11, Fe 7.5e-11). stress: (1/Ω) ∂/∂ε of the same error; a strain moves a point r by ε r, |r| \
≤ D, the cell's longest diagonal, so ≤ G_max · D · 1.08e-11 / Ω (Si 3.8e-12 to 4.0e-12, Fe pair 4.5e-12, Fe atom \
9.0e-12 Ha/Bohr³). fmax: ASE's stop on the cold forces, max over atoms |f| / 0.01 eV/Å"""
si-ions = """\
Si pair, fixed fcc cell, rattled; 8 Ha, 2³ k; 6 BFGS steps. Record shares: F 1.8e-3 (2.0e-14 Ha), force 4.2e-3 \
(2.6e-13 Ha/Bohr), stress 1.0e-3 (4.0e-15 Ha/Bohr³)"""
si-cell = """\
the same atoms in a sheared, stretched cell; 13 BFGS steps. Record shares: F 1.4e-3, force 1.1e-5, stress 1.7e-6"""
fe-ions = """\
ferromagnetic Fe pair, fixed cubic cell, rattled; 12 Ha; 4 BFGS steps, 4.155 μB from a start of 2 × 2.5. Record \
shares: F 6.6e-2 (7.1e-13 Ha), force 2.4e-3 (1.8e-13 Ha/Bohr), stress 0.13 (6.0e-13 Ha/Bohr³)"""
fe-cell = """\
ferromagnetic one-atom bcc Fe, strained cell; 12 Ha, 4³ k; 17 BFGS steps, 1.885 μB from a start of 2.5. The one-atom \
cell, whose forces vanish by symmetry: the Fe pair at a free cell slides from bcc toward fcc at 2³ k (−1.26 eV over \
41 steps, 190 s). Its F rises 0.019 eV along the path: at 12 Ha the fixed-set stress is not dF/dV across set changes \
(case 15 reference); the endpoint check holds at any cutoff. Record shares 0, 0, 0: two cold runs of one geometry, \
bitwise equal"""
