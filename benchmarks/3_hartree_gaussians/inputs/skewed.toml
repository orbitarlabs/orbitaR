# Four Gaussians of unlike widths, the widest reaching past the next cells, and a net charge in a
# skewed cell; a background cancels the net.
schema = 1

[structure]
cell_bohr = [[6.0, 0.0, 0.0], [2.0, 7.0, 0.0], [1.0, -1.5, 8.0]]

[basis]
cutoff_ha = 20.0

[kpoints]
list = [[0.0, 0.0, 0.0]]

[probe]
term = "hartree"
charges = [2.0, -0.5, 0.7, -1.0]
exponents = [2.8, 0.8, 1.2, 0.25]
positions_fractional = [[0.1, 0.2, 0.3], [0.6, 0.4, 0.8], [0.3, 0.9, 0.5],
                        [0.85, 0.15, 0.05]]
