[case]
tier = "node"
status = "active"
claims = ["correctness"]
reference = "same-dataset"

[tolerance]
free_energy_error_ev_max = 2.7e-6

[why]
inputs = "Na runs 2.5 Ha below its XML hint, as ABINIT did"
free_energy_error_ev_max = """\
per cell: 20 × ABINIT's 11-digit print floor, 5e-9 Ha below |E| = 1e3 Ha; both SCF stops sit lower. The two codes \
agree in absolute energy, so no constant is fitted. The bound catches a code error that moves one point past it, long \
before ε would; ε is only reported: xtask/tests/harness/eos.rs shows that the bound keeps it below 3.9e-3"""
