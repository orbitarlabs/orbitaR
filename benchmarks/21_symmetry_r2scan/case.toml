[why]
tier = """\
nightly: a full run evaluates every image of every atom. Diamond Si's full run took 244 s at two threads on an arm64 \
workstation, and CI's 2-CPU runner was 3.4 to 7.8 times slower on five case 6 and 7 inputs, so about 830 s or more \
there, past the pr tier's 600 s"""
inputs = """\
Fe and diamond Ge, whose d channels break the site group on ABINIT's 12 × 13 mesh: the reduced run averages D over \
the operations (ABINIT symdij), the full one the mesh energy over the operations' images. Ge (4.9 Ha at 5.76 Å) gets \
the grids of case 7's Si at 5.5 Ha, which keep the operations with t = ¼; its inversion maps one atom onto the other"""
tolerance = "case 7's bounds"
