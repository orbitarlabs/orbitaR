[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[project]
name = "orbitar-jth"
version = "2.0.0"
description = "The JTH v2.0 PAW-XML datasets of family jth-2.0 for orbitar"
authors = [{ name = "The orbitaR developers" }]
requires-python = ">=3.12"
license = "GPL-3.0-only"
license-files = ["LICENSE", "NOTICE"]

[project.urls]
Homepage = "https://orbitarlabs.org"
Source = "https://github.com/orbitarlabs/orbitaR"

[project.entry-points."orbitar.datasets"]
"jth-2.0" = "orbitar_jth"

[tool.uv.build-backend]
module-root = ""
