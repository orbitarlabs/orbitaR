name: package

on:
  pull_request:
    paths:
      - "python/**"
      - "pyproject.toml"
      - "packages/**"
      - "datasets/jth-2.0.toml"
      - "Cargo.*"
      - ".cargo/**"
      - "src/main.rs"
      - "container/**"
      - ".dockerignore"
      - "xtask/src/release.rs"
      - "xtask/src/harness/datasets.rs"
      - "xtask/src/release/**"
      - "xtask/src/reproduce.rs"
      - ".github/workflows/package.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Free the runner's disk
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /usr/share/swift /usr/local/.ghcup /opt/ghc \
            /usr/lib/jvm /usr/local/share/boost /usr/local/share/chromium /usr/local/share/powershell \
            /opt/microsoft /opt/google /usr/local/julia*
          sudo find "$RUNNER_TOOL_CACHE" -mindepth 1 -delete
          df -h /
      - name: Install the pinned toolchain
        run: rustup show active-toolchain
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          python-version: "3.12.16"
      - run: cargo xtask reproduce
      - run: cargo xtask wheel
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheel
          path: target/wheel/wheel/*.whl
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jth-wheel
          path: target/wheel/jth-wheel/*.whl
          retention-days: 7
      - run: cargo xtask image

  mac-wheel:
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Library/Developer/CommandLineTools
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup show active-toolchain
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: false
          save-cache: false
      - run: uname -m
      - name: Print the Command Line Tools
        run: |
          pkgutil --pkg-info=com.apple.pkg.CLTools_Executables
          xcrun --show-sdk-path
          xcrun --show-sdk-version
          xcrun --show-sdk-build-version
          xcrun clang --version
          xcrun ld -v
      - run: cargo xtask wheel --target aarch64-apple-darwin
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mac-wheel
          path: target/wheel-aarch64-apple-darwin/dist/*.whl
          retention-days: 7

  same-jth:
    needs: [package, mac-wheel]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup show active-toolchain
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: jth-wheel
          path: linux
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mac-wheel
          path: mac
      - run: cargo xtask wheel --same linux/orbitar_jth-*.whl mac/orbitar_jth-*.whl
