name: text

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: text-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  text:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install the pinned toolchain
        run: rustup show active-toolchain
      - name: The pull request text and each commit of the branch hold no generated-by line
        env:
          BODY: ${{ github.event.pull_request.body }}
          BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          printf '%s\n' "$BODY" > "$RUNNER_TEMP/pr-body.md"
          cargo xtask pr-text --body "$RUNNER_TEMP/pr-body.md" --base "$BASE" --head "$PR_HEAD"
