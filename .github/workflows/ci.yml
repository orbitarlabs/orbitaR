name: check

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

env:
  TEST_RUNNER: env MALLOC_ARENA_MAX=1 prlimit --as=2147483648 --

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install the pinned toolchain
        run: rustup show active-toolchain
      - name: Restore the cargo registry and the build directories
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target/debug
            target/release
            target/package
          key: check-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      - name: Keep scratch private to the working tree
        run: |
          test -z "$(git ls-files -- scratch)"
          git check-ignore --quiet scratch/ci/probe
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          python-version: "3.12.16"
          venv-path: ${{ runner.temp }}/python
          activate-environment: true
          enable-cache: true
          cache-python: true
          cache-dependency-glob: |
            python/pylock.toml
      - name: Install the hash-pinned Python wheels (ase and its whole closure)
        run: |
          uv pip install --no-build -r python/pylock.toml
          python3 -I -c 'import sys, ase, numpy, scipy; print(sys.version.split()[0], ase.__version__, numpy.__version__, scipy.__version__)'
          python3 -I -c 'import ase.calculators.genericfileio, ase.calculators.espresso, ase.optimize, ase.io, ase.build'
      - run: cargo xtask check
      - name: The unit tests pass under the mutants cap
        run: |
          test "$(rustc -vV | sed -n 's/^host: //p')" = x86_64-unknown-linux-gnu
          cargo test --workspace --all-features --locked --test unit
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: ${{ env.TEST_RUNNER }}
      - run: cargo xtask science --base origin/main
        if: github.event_name == 'pull_request'
      - run: cargo xtask docs --base origin/main
        if: github.event_name == 'pull_request'
      - run: cargo xtask smoke
      - name: Print the push records
        if: always()
        run: cargo xtask records push
      - run: cargo xtask bench pr
        if: github.event_name == 'pull_request'
      - name: Print the pr records
        if: always() && github.event_name == 'pull_request'
        run: cargo xtask records pr
      - run: cargo build --release --locked
      - name: Restore the pinned ATOMPAW install
        id: atompaw-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/atompaw
          key: atompaw-${{ runner.os }}-${{ hashFiles('benchmarks/DATASETS.toml') }}
      - name: Install micromamba 2.9.0 (conda-forge, sha256 checked) and the pinned ATOMPAW
        if: steps.atompaw-cache.outputs.cache-hit != 'true'
        run: |
          curl -sSfL -o "$RUNNER_TEMP/micromamba.tar.bz2" \
            https://conda.anaconda.org/conda-forge/linux-64/micromamba-2.9.0-0.tar.bz2
          echo "8761c382127e6363bd9e0a2451aa3ef90d071a79133f736e2f759a3bf13040dd  $RUNNER_TEMP/micromamba.tar.bz2" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/micromamba"
          tar -xjf "$RUNNER_TEMP/micromamba.tar.bz2" -C "$RUNNER_TEMP/micromamba" bin/micromamba
          PATH="$RUNNER_TEMP/micromamba/bin:$PATH" MAMBA_ROOT_PREFIX="$RUNNER_TEMP/mamba" \
            cargo xtask atompaw --install "$RUNNER_TEMP/atompaw"
      - name: Build each input of each family of ours twice at its pin
        run: cargo xtask atompaw
        env:
          ORBITAR_ATOMPAW: ${{ runner.temp }}/atompaw
      - name: Save the ATOMPAW install
        if: github.ref == 'refs/heads/main' && steps.atompaw-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/atompaw
          key: ${{ steps.atompaw-cache.outputs.cache-primary-key }}
      - name: Leave the tree as committed
        run: test -z "$(git status --porcelain)"
      - name: Check dependencies with cargo-deny 0.20.2
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          rust-version: "1.99.1"
      - name: Save the cargo registry and the build directories
        if: github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target/debug
            target/release
            target/package
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  mutants:
    if: github.event_name == 'pull_request' && vars.MUTANTS_LOCAL != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    env:
      CARGO_PROFILE_DEV_DEBUG: "false"
      CARGO_PROFILE_TEST_DEBUG: "false"
      NEXTEST_PROFILE: mutants
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install the pinned toolchain
        run: rustup show active-toolchain
      - name: Install cargo-mutants and cargo-nextest (prebuilt; the action checks each sha256)
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-mutants@27.1.0,cargo-nextest@0.9.148
          fallback: none
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          python-version: "3.12.16"
          venv-path: ${{ runner.temp }}/python
          activate-environment: true
          enable-cache: true
          cache-python: true
          cache-dependency-glob: |
            python/pylock.toml
      - name: Install the hash-pinned Python wheels (ase and its whole closure)
        run: |
          uv pip install --no-build -r python/pylock.toml
          python3 -I -c 'import sys, ase, numpy, scipy; print(sys.version.split()[0], ase.__version__, numpy.__version__, scipy.__version__)'
          python3 -I -c 'import ase.calculators.genericfileio, ase.calculators.espresso, ase.optimize, ase.io, ase.build'
      - name: Show the runner's cores, memory, disk, and test cap
        run: |
          nproc && free -m && df -h .
          prlimit --version
          test "$(rustc -vV | sed -n 's/^host: //p')" = x86_64-unknown-linux-gnu
          $TEST_RUNNER prlimit --as --noheadings
      - name: A test fails for each mutant of a changed line
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: ${{ env.TEST_RUNNER }}
        run: |
          git diff origin/main... > "$RUNNER_TEMP/pr.diff"
          status=0
          timeout 320m cargo mutants --in-diff "$RUNNER_TEMP/pr.diff" --workspace \
            --shard ${{ matrix.shard }}/8 --sharding round-robin --jobs 2 --minimum-test-timeout 60 \
            --test-tool nextest --cargo-arg=--test=unit || status=$?
          if [ "$status" -eq 3 ] && [ ! -s mutants.out/missed.txt ]; then status=0; fi
          exit "$status"
      - name: Keep each outcome and log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutants-${{ matrix.shard }}
          path: mutants.out
          if-no-files-found: ignore

  mutants-all:
    if: always() && github.event_name == 'pull_request'
    needs: mutants
    runs-on: ubuntu-latest
    steps:
      - name: Every mutants shard passed, or the pull request records a local run at its head
        env:
          RESULT: ${{ needs.mutants.result }}
          LOCAL: ${{ vars.MUTANTS_LOCAL }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          if [ "$RESULT" = success ]; then exit 0; fi
          if [ "$LOCAL" != true ]; then
            echo "mutants-all: the mutants job's result is '$RESULT', not success, and MUTANTS_LOCAL is not true"
            exit 1
          fi
          if [ "$RESULT" != skipped ]; then
            echo "mutants-all: MUTANTS_LOCAL is true, but the mutants job's result is '$RESULT', not skipped"
            exit 1
          fi
          if grep -Eq "^Local mutants at $HEAD: [0-9]+ mutants, 0 missed" <<< "$BODY"; then exit 0; fi
          echo "mutants-all: the pull request text has no line 'Local mutants at $HEAD: <N> mutants, 0 missed'"
          exit 1

  nightly:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned toolchain
        run: rustup show active-toolchain
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          python-version: "3.12.16"
          venv-path: ${{ runner.temp }}/python
          activate-environment: true
          enable-cache: true
          cache-python: true
          cache-dependency-glob: python/pylock.toml
      - name: Install the hash-pinned Python wheels (ase and its whole closure)
        run: |
          uv pip install --no-build -r python/pylock.toml
          python3 -I -c 'import sys, ase, numpy, scipy; print(sys.version.split()[0], ase.__version__, numpy.__version__, scipy.__version__)'
          python3 -I -c 'import ase.calculators.genericfileio, ase.calculators.espresso, ase.optimize, ase.io, ase.build'
      - run: cargo xtask bench nightly
      - name: Print the nightly records
        if: always()
        run: cargo xtask records nightly
